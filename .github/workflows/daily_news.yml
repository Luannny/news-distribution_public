name: Daily News Brief

on:
  schedule:
    # 00:00 UTC = 每天北京时间 08:00；GitHub 可能延迟启动。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "发送邮件（不勾选时只生成预览）"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: daily-news-brief
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
      AI_PROVIDER: gemini
      REQUIRE_AI: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: '587'
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Gemini and email configuration
        run: |
          python - <<'PY'
          import os
          required = ['GEMINI_API_KEY']
          if os.getenv('SEND_EMAIL') == 'true':
              required += ['EMAIL_USER', 'EMAIL_PASSWORD', 'EMAIL_TO']
          missing = [name for name in required if not os.getenv(name, '').strip()]
          if missing:
              raise SystemExit('请先在 Settings → Secrets and variables → Actions 中填写：' + ', '.join(missing))
          PY

      - name: Generate briefing or send email
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python -m src.main
          else
            python -m src.main --dry-run
          fi

      - name: Show Chinese preview on the results page
        if: env.SEND_EMAIL != 'true'
        run: |
          python - <<'PY'
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          class PreviewText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.in_head = False
                  self.link = ''

              def handle_starttag(self, tag, attrs):
                  if tag == 'head':
                      self.in_head = True
                  if tag in ('h1', 'h2', 'h3') and not self.in_head:
                      self.parts.append('\n' + '#' * int(tag[1]) + ' ')
                  if tag == 'a':
                      self.link = dict(attrs).get('href', '')

              def handle_data(self, data):
                  if not self.in_head and data.strip():
                      self.parts.append(data.strip())

              def handle_endtag(self, tag):
                  if tag == 'head':
                      self.in_head = False
                  if tag == 'a' and self.link:
                      self.parts.append('：' + self.link)
                      self.link = ''
                  if tag in ('p', 'h1', 'h2', 'h3', 'article'):
                      self.parts.append('\n\n')

          preview = PreviewText()
          preview.feed(Path('daily_news_preview.html').read_text(encoding='utf-8'))
          text = '本次只生成预览，未发送邮件。\n\n' + ''.join(preview.parts)
          Path('daily_news_preview.md').write_text(text, encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(text)
          PY

      - name: Save email preview
        if: env.SEND_EMAIL != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-preview
          path: |
            daily_news_preview.html
            daily_news_preview.md
          if-no-files-found: error
          retention-days: 7
