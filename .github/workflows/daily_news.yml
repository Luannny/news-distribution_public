name: Daily News Brief

on:
  schedule:
    # 00:00 UTC = 每天北京时间 08:00；GitHub 可能延迟启动。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "发送邮件（不勾选时只生成预览）"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: daily-news-brief
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
      AI_PROVIDER: gemini
      REQUIRE_AI: 'true'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: '587'
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Gemini and email configuration
        run: |
          python - <<'PY'
          import os
          required = ['GEMINI_API_KEY']
          if os.getenv('SEND_EMAIL') == 'true':
              required += ['EMAIL_USER', 'EMAIL_PASSWORD', 'EMAIL_TO']
          missing = [name for name in required if not os.getenv(name, '').strip()]
          if missing:
              raise SystemExit('请先在 Settings → Secrets and variables → Actions 中填写：' + ', '.join(missing))
          PY

      - name: Generate briefing or send email
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python -m src.main
          else
            python -m src.main --dry-run
          fi

      - name: Save email preview
        if: env.SEND_EMAIL != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-news-preview
          path: daily_news_preview.html
          if-no-files-found: error
          retention-days: 7
